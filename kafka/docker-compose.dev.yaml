services:
  kafka-0:
    image: apache/kafka:latest
    hostname: kafka-0
    user: root
    ports:
      - "9092"
    environment:
      # KRaft settings, single node: this broker is also its own controller.
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Single-node cluster: one broker can't satisfy a replication factor > 1.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/opt/kafka/data
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_0_data:/opt/kafka/data
    networks:
      - ktdl-network

  # Runs once and exits. Re-run: docker compose run --rm booking-producer
  booking-producer:
    build: ./producer
    hostname: booking-producer
    restart: "no"
    environment:
      PG_HOST: ${PG_HOST:-db}
      PG_PASSWORD: ${PG_PASSWORD:-123456}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-0:9092}
      SPEED_FACTOR: ${SPEED_FACTOR:-4000}
      MIN_GAP_SECONDS: ${MIN_GAP_SECONDS:-0.05}
      LIMIT_BOOKINGS: ${LIMIT_BOOKINGS:-}
    networks:
      - ktdl-network

  # Runs once and exits. Re-run: docker compose run --rm flight-producer
  flight-producer:
    build: ./producer
    hostname: flight-producer
    restart: "no"
    command: ["python", "flight_producer.py"]
    environment:
      PG_HOST: ${PG_HOST:-db}
      PG_PASSWORD: ${PG_PASSWORD:-123456}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-0:9092}
      SPEED_FACTOR: ${SPEED_FACTOR:-4000}
      MIN_GAP_SECONDS: ${MIN_GAP_SECONDS:-0.05}
      LIMIT_FLIGHTS: ${LIMIT_FLIGHTS:-}
    networks:
      - ktdl-network

volumes:
  kafka_0_data:
    driver: local

networks:
  ktdl-network:
    external: true
