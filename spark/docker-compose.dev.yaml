services:
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    hostname: spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "${SPARK_UI_PORT:-8080}:8080"
    environment:
      HADOOP_USER_NAME: ${HADOOP_USER_NAME:-root}
    volumes:
      - ../pipeline:/opt/pipeline:ro
    networks:
      - ktdl-network

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark:7077", "--webui-port", "8081"]
    depends_on:
      - spark
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      HADOOP_USER_NAME: ${HADOOP_USER_NAME:-root}
    volumes:
      - ../pipeline:/opt/pipeline:ro
    networks:
      - ktdl-network

  spark-stream:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    hostname: spark-stream
    depends_on:
      - spark
    restart: unless-stopped
    environment:
      HOME: /tmp
      HADOOP_USER_NAME: ${HADOOP_USER_NAME:-root}
      PG_URL: ${PG_URL:-jdbc:postgresql://db:5432/demo}
      LAKE_WAREHOUSE: ${LAKE_WAREHOUSE:-hdfs://namenode:9000/warehouse}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-0:9092}
      BOOKING_TOPIC: ${BOOKING_TOPIC:-booking.created}
      DEPARTED_TOPIC: ${DEPARTED_TOPIC:-flight.departed}
      ARRIVED_TOPIC: ${ARRIVED_TOPIC:-flight.arrived}
      MONGO_URI: ${MONGO_URI:-mongodb://root:123456@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-airlines}
    volumes:
      - ../pipeline:/opt/pipeline:ro
    networks:
      - ktdl-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        pip install --quiet --no-cache-dir pymongo &&
        /opt/spark/bin/spark-submit
        --master spark://spark:7077
        --conf spark.driver.host=spark-stream
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.driver.memory=512m
        --conf spark.executor.memory=1g
        --conf spark.cores.max=1
        --conf spark.scheduler.mode=FAIR
        --conf spark.sql.shuffle.partitions=8
        --conf spark.sql.session.timeZone=UTC
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.lake=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.lake.type=hadoop
        --conf spark.sql.catalog.lake.warehouse=${LAKE_WAREHOUSE:-hdfs://namenode:9000/warehouse}
        --conf spark.executorEnv.HADOOP_USER_NAME=root
        --conf spark.jars.ivy=/tmp/.ivy2
        --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
        --py-files /opt/pipeline/common.py
        /opt/pipeline/stream_main.py

networks:
  ktdl-network:
    external: true
